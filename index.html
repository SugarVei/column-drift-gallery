<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101014">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="全屏相册，支持漂移、双螺旋、速度折叠、互动照片球、斜向照片墙与无边照片墙。">
  <title>Sugar' memory</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=memory-dock-v2">
  <script src="photos.js?v=memory-dock-v2" defer></script>
  <script src="coverflow.js?v=memory-dock-v2" defer></script>
  <script src="photo-displays.js?v=memory-dock-v2" defer></script>
  <script src="app.js?v=memory-dock-v2" defer></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="identity"><h1>Sugar' memory<span class="dot" aria-hidden="true"></span></h1><span id="photo-count" class="photo-count">40</span></div>
      <div class="top-actions">
        <button id="add-photos" class="button primary" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>添加照片</button>
        <button id="manage-photos" class="button subtle" type="button" title="管理自己添加的照片">我的照片</button>
        <button id="fullscreen" class="button icon-button" type="button" aria-label="进入全屏" title="进入全屏"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button>
      </div>
    </header>
    <nav class="style-dock" aria-label="展示风格与背景">
      <div class="dock-styles">
        <button class="dock-button" type="button" data-style="drift" aria-pressed="true" aria-label="五列漂移"><span class="style-orb" aria-hidden="true"></span><span class="dock-tip" aria-hidden="true">五列漂移</span></button>
        <button class="dock-button" type="button" data-style="helix" aria-pressed="false" aria-label="双螺旋"><span class="style-orb" aria-hidden="true"></span><span class="dock-tip" aria-hidden="true">双螺旋</span></button>
        <button class="dock-button" type="button" data-style="velocity" aria-pressed="false" aria-label="速度折叠"><span class="style-orb" aria-hidden="true"></span><span class="dock-tip" aria-hidden="true">速度折叠</span></button>
        <button class="dock-button" type="button" data-style="sphere" aria-pressed="false" aria-label="互动照片球"><span class="style-orb" aria-hidden="true"></span><span class="dock-tip" aria-hidden="true">互动照片球</span></button>
        <button class="dock-button" type="button" data-style="tilt" aria-pressed="false" aria-label="斜向照片墙"><span class="style-orb" aria-hidden="true"></span><span class="dock-tip" aria-hidden="true">斜向照片墙</span></button>
        <button class="dock-button" type="button" data-style="wall" aria-pressed="false" aria-label="无边照片墙"><span class="style-orb" aria-hidden="true"></span><span class="dock-tip" aria-hidden="true">无边照片墙</span></button>
      </div>
      <div class="dock-theme">
        <button id="theme-toggle" class="liquid-toggle" type="button" role="switch" aria-label="黑色背景" aria-checked="true">
          <span class="liquid-thumb" aria-hidden="true"></span><span class="dock-tip" aria-hidden="true">黑色背景</span>
        </button>
      </div>
    </nav>
    <main class="gallery" id="gallery" aria-label="照片展示">
      <div class="viewport" id="viewport"></div>
      <div id="loading" class="loading" role="status">正在整理回忆…</div>
    </main>
    <footer class="toolbar" aria-label="相册设置">
      <div class="settings">
        <label class="columns-label" for="columns">布局</label><select id="columns" aria-label="照片列数"><option value="2">2 列</option><option value="3">3 列</option><option value="4">4 列</option><option value="5" selected>5 列</option><option value="6">6 列</option></select>
        <button id="next-group" class="button subtle" type="button" hidden>换一组 <span id="group-label">1 / 1</span></button>
        <button id="hide-controls" class="button icon-button" type="button" aria-label="隐藏控制栏" title="隐藏控制栏"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 8 6 6 6-6"/></svg></button>
      </div>
    </footer>
    <button id="show-controls" class="button show-controls" type="button" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h12"/></svg>显示控制栏</button>
  </div>
  <input id="file-input" class="sr-only" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/bmp" multiple tabindex="-1">
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="photo-dialog" aria-labelledby="dialog-title">
    <div class="dialog-header"><div><h2 id="dialog-title">我的照片</h2><p>添加的照片仅保存在当前浏览器。</p></div><button id="close-dialog" class="button icon-button" aria-label="关闭" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
    <div id="personal-grid" class="personal-grid"></div>
    <p id="empty-message" class="empty-message">还没有添加照片。把喜欢的瞬间放进来吧。</p>
    <label id="personal-only-option" class="personal-only" hidden><input id="personal-only" type="checkbox">仅展示我添加的照片</label>
    <div class="dialog-footer"><span id="saved-count">0 张照片</span><button id="restore-defaults" class="button subtle danger" type="button" disabled>清除我的照片</button><button id="dialog-add" class="button primary" type="button">添加照片</button></div>
  </dialog>
  <noscript><p class="noscript">请启用浏览器 JavaScript 以播放照片动画。</p></noscript>
</body>
</html>
